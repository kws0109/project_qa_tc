<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QATC</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="tree">
    <h1>QATC</h1>
    <div id="tree-body"><p class="empty">불러오는 중…</p></div>
  </aside>

  <main id="chat">
    <div id="chat-header">
      <span id="chat-content-label">컨텐츠를 선택하지 않음</span>
      <div id="chat-header-right">
        <span id="claude-status" class="badge"></span>
        <button id="chat-new-btn" type="button">선택 해제</button>
      </div>
    </div>
    <div id="chat-log" aria-live="polite"></div>
    <div id="chat-attachments" hidden></div>
    <div id="chat-tools">
      <button id="capture-btn" type="button" title="게임 창을 찍어 첨부합니다">게임 화면 촬영</button>
    </div>
    <form id="chat-form">
      <textarea id="chat-input" rows="2" placeholder="메시지를 입력하세요 (Shift+Enter 로 줄바꿈 · 스크린샷은 붙여넣거나 끌어다 놓으세요)"></textarea>
      <button id="chat-send" type="submit">보내기</button>
    </form>
  </main>

  <section id="review">
    <div id="review-toolbar">
      <button id="export-btn" type="button" disabled>엑셀로 열기</button>
      <div id="export-status"></div>
    </div>
    <div id="review-empty" class="empty">컨텐츠를 먼저 선택하세요.</div>
    <div id="review-body" hidden></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
