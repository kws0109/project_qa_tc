name: 붕괴 스타레일

# ── 아래 필드 중 일부는 현재 코드에서 읽지 않는다 ──────────────────────────
# window 는 창 캡처가 읽는다. capture_roi/static_ignore/key_hints/input 은
# 녹화 파이프라인 삭제 이후 여전히 읽지 않는 값이지만, llm_context 는 실측으로
# 얻은 게임 UI 구조·용어 지식이라 재수집 비용이 커서 지우지 않고 남겨 둔다 —
# 인터뷰 스킬에 게임 맥락을 주입하는 기능이 생기면 여기서 가져다 쓸 수 있다.
window:
  title_regex: "^(崩壊：スターレイル|崩坏：星穹铁道|Honkai: Star Rail|붕괴: 스타레일)$"
  process: StarRail.exe
capture_roi: full
ui_language: ko
is_emulator: false

static_ignore:
  - {x: 0.87, y: 0.00, w: 0.13, h: 0.05, why: "우측 상단 시간/재화 갱신 표시"}
  - {x: 0.00, y: 0.00, w: 0.20, h: 0.09, why: "좌측 상단 개척력/이동 정보"}
  - {x: 0.00, y: 0.90, w: 0.24, h: 0.10, why: "좌측 하단 알림 토스트"}

key_hints:
  esc: 메뉴/뒤로가기
  c: 캐릭터
  b: 가방
  m: 지도
  f: 상호작용
  v: 전투 스킬
# 입력 해석 규칙 — 실측 세션에서 확인된 스타레일의 특성
input:
  # 메인화면(필드)에서는 Alt를 홀드해야 마우스 포인터가 활성화된다.
  # 메뉴에 들어가면 홀드 없이 바로 활성화된다.
  # → Alt를 안 누른 상태의 클릭은 포인터가 화면 중앙에 잠겨 있어
  #   좌표가 항상 (0.50, 0.50)으로 찍힌다. 그 클릭은 좌표를 신뢰할 수 없다.
  pointer_modifier: alt
  # 이동·카메라 키는 QA 테스트케이스의 대상이 아니다.
  # 기록하지 않으면 버스트 캡처도 예약되지 않아 디스크와 분석 시간이 함께 줄어든다.
  ignore_keys: [w, a, s, d, space, ctrl, shift, tab, q, f, v]
  # 좌표가 불확실한 클릭도 기록은 한다 — "필드에서 무언가 클릭했다"는 사실은
  # 남기되 좌표에 의존하지 않게 표시만 해둔다.
  drop_unmodified_clicks: false

llm_context: |
  호요버스의 턴제 RPG. UI는 가로 레이아웃이며 화면 전환 연출이 화려하다.
  주요 화면 계층: 필드(탐험) → ESC 메뉴 → 캐릭터 / 가방 / 광추 / 유물 / 워프(가챠) /
  임무 / 지침 / 상점 / 설정.
  캐릭터 화면은 좌측 캐릭터 목록, 우측 상단 탭(속성/광추/유물/궤적/성혼)으로 구성된다.
  유물 장착은 부위 선택 → 유물 목록 → 장착 버튼 순서다.
  워프 화면은 배너 전환, 1회/10회 버튼, 성간 항행권 수량이 핵심 요소다.
  전투는 턴제라 화면이 정적으로 보이지만 캐릭터 대기 모션과 배경 이펙트가 계속 움직인다.
