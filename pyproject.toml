[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatc"
version = "0.1.0"
description = "게임 QA 테스트케이스 자동 생성 도구 (Game QA Test Case generator)"
requires-python = ">=3.11"
dependencies = [
    # --- 출력 ---
    "openpyxl>=3.1",
    # --- 프로파일 로딩 ---
    "pyyaml>=6.0",
    # --- 로컬 웹 서버: 라우팅·SSE·동시 요청을 직접 구현하지 않기 위해 씀 ---
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qatc = "qatc.cli:main"

[tool.setuptools.packages.find]
include = ["qatc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
